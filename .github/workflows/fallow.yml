name: Fallow pilot

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Report changed-code findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Run report-only Fallow audit
        uses: fallow-rs/fallow@589885290490eeeb02fcc274defc55a3c11789dc # v2.86.0
        with:
          version: 2.86.0
          command: audit
          gate: new-only
          fail-on-issues: false
          annotations: true
          max-annotations: 20
          branded-token: false
          comment: false
          summary-scope: diff
          diff-filter: added
